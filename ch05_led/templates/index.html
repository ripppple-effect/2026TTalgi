<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LED ON / OFF</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #202020;
      font-family: Arial, Helvetica, sans-serif;
    }

    .led-container {
      width: 450px;
      padding: 10px 20px 18px;
      text-align: center;
      background-color: white;
      border-radius: 4px;
    }

    h1 {
      margin: 0;
      color: #191919;
      font-size: 64px;
      font-weight: 400;
      line-height: 1.3;
      white-space: nowrap;
    }

    #led {
      display: block;
      width: 260px;
      height: 350px;
      margin: 0 auto;
      object-fit: contain;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    button {
      min-width: 105px;
      padding: 16px 20px;
      border: none;
      border-radius: 11px;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    #on {
      background-color: #176ff2;
    }

    #off {
      background-color: #198b58;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(0.96);
    }

    @media (max-width: 500px) {
      .led-container {
        width: calc(100vw - 30px);
      }

      h1 {
        font-size: 44px;
      }

      #led {
        width: 230px;
        height: 320px;
      }
    }
  </style>
</head>

<body>
  <main class="led-container">
    <h1>LED ON / OFF</h1>

    <img
      id="led"
      src="{{ url_for('static', filename='off.png') }}"
      alt="LED 전구"
    >

    <div class="button-container">
      <button type="button" id="on">ON</button>
      <button type="button" id="off">OFF</button>
    </div>
  </main>

  <script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
